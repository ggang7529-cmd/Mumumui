<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>책갈피</title>
<meta name="description" content="책을 읽고 남긴 리뷰와 한 줄 댓글을 모아두는 개인 서재">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --paper: #EFEAE1;
    --paper-soft: #E2D9C9;
    --paper-raised: #F7F3EC;
    --ink: #241F1C;
    --ink-soft: #6B6058;
    --ink-faint: #94897C;
    --accent: #8C2F39;
    --accent-soft: #B5555F;
    --line: rgba(36, 31, 28, 0.14);
    --shadow: rgba(36, 31, 28, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1815;
      --paper-soft: #262019;
      --paper-raised: #221D19;
      --ink: #EDE6DA;
      --ink-soft: #A79C8E;
      --ink-faint: #766B5F;
      --accent: #E08A90;
      --accent-soft: #C1636B;
      --line: rgba(237, 230, 218, 0.16);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1B1815;
    --paper-soft: #262019;
    --paper-raised: #221D19;
    --ink: #EDE6DA;
    --ink-soft: #A79C8E;
    --ink-faint: #766B5F;
    --accent: #E08A90;
    --accent-soft: #C1636B;
    --line: rgba(237, 230, 218, 0.16);
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* header */

  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2.25rem;
  }

  .brand {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
  }

  .ribbon {
    width: 10px;
    height: 52px;
    flex: none;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    margin-top: 2px;
  }

  .brand h1 {
    margin: 0;
    font-family: "Gowun Batang", "Malgun Gothic", serif;
    font-weight: 700;
    font-size: clamp(1.9rem, 4vw, 2.4rem);
    letter-spacing: 0.02em;
  }

  .tagline {
    margin: 0.3rem 0 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  .btn-primary {
    flex: none;
    background: var(--accent);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 0.65rem 1.1rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .btn-primary:hover { background: var(--accent-soft); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* library grid */

  .library-meta {
    color: var(--ink-faint);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin-bottom: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.1rem;
  }

  .book-card {
    position: relative;
    display: block;
    aspect-ratio: 2 / 3;
    text-align: left;
    background: var(--cover, var(--accent));
    color: #F3EEE4;
    border: none;
    border-radius: 4px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 10px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .book-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px var(--shadow);
  }

  .b-cover-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  .b-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 0.85rem 0.8rem 0.75rem;
    background: linear-gradient(to top, rgba(10, 8, 6, 0.85) 0%, rgba(10, 8, 6, 0.55) 48%, rgba(10, 8, 6, 0) 100%);
  }

  .book-card .b-title {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.35;
    text-wrap: balance;
    margin: 0 0 0.3rem;
  }

  .book-card .b-author {
    font-size: 0.8rem;
    opacity: 0.9;
    margin: 0 0 0.5rem;
  }

  .book-card .b-stars {
    font-size: 0.85rem;
    letter-spacing: 0.06em;
  }

  .book-card .b-comment-count {
    font-size: 0.72rem;
    opacity: 0.8;
    margin-top: 0.25rem;
  }

  .add-card {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 2 / 3;
    border: 1.5px dashed var(--line);
    border-radius: 4px;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    text-align: center;
    padding: 0.75rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .add-card:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .empty-note {
    color: var(--ink-faint);
    font-size: 0.9rem;
    padding: 1.5rem 0;
  }

  /* form */

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.75rem;
  }

  .panel h2 {
    font-family: "Gowun Batang", serif;
    margin: 0 0 1.4rem;
    font-size: 1.4rem;
  }

  .field {
    margin-bottom: 1.15rem;
  }

  .field label {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-bottom: 0.4rem;
  }

  .field input[type="text"],
  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.6rem 0.7rem;
    resize: vertical;
  }

  .field textarea { min-height: 110px; line-height: 1.6; }

  .cover-picker {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .cover-preview {
    width: 72px;
    aspect-ratio: 2 / 3;
    flex: none;
    border-radius: 4px;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    font-size: 0.68rem;
    text-align: center;
    line-height: 1.4;
    padding: 0.3rem;
  }

  .cover-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-picker-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }

  .cover-picker-controls input[type="file"] {
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 230px;
  }

  .star-picker {
    display: flex;
    gap: 0.25rem;
  }

  .star-picker button {
    background: none;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0.1rem;
  }

  .star-picker button.filled { color: var(--accent); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: 1.5rem;
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 0.6rem 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* detail */

  .back-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.3rem 0;
    margin-bottom: 1.25rem;
  }

  .back-btn:hover { color: var(--accent); }

  .detail-top {
    display: flex;
    gap: 1.25rem;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 1.1rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--line);
  }

  .detail-cover {
    width: 96px;
    aspect-ratio: 2 / 3;
    flex: none;
    border-radius: 4px;
    overflow: hidden;
    background: var(--cover, var(--accent));
    box-shadow: 0 3px 10px var(--shadow);
  }

  .detail-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .detail-card header {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1;
    min-width: 200px;
  }

  .detail-card h2 {
    font-family: "Gowun Batang", serif;
    font-size: 1.7rem;
    margin: 0;
    text-wrap: balance;
  }

  .detail-author { color: var(--ink-soft); margin: 0; font-size: 0.95rem; }

  .stars { color: var(--accent); letter-spacing: 0.08em; font-size: 1.05rem; }
  .stars .empty { color: var(--ink-faint); }

  .meta-date {
    color: var(--ink-faint);
    font-size: 0.8rem;
    margin: 0.2rem 0 0;
    font-variant-numeric: tabular-nums;
  }

  .detail-review {
    max-width: 62ch;
    font-family: "Gowun Batang", serif;
    font-size: 1.18rem;
    line-height: 1.5;
    margin: 0 0 0.25rem;
  }

  .detail-review::before,
  .detail-review::after {
    color: var(--accent);
  }

  .detail-review::before { content: "\201C"; }
  .detail-review::after { content: "\201D"; }

  .btn-ghost-danger {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 3px;
    padding: 0.5rem 0.9rem;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 0.5rem;
  }

  .btn-ghost-danger:hover { border-color: var(--accent); color: var(--accent); }

  .comments {
    margin-top: 2.25rem;
  }

  .comments h3 {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 0.9rem;
  }

  .comments h3 .count {
    color: var(--ink-faint);
    font-weight: 400;
    font-size: 0.85rem;
  }

  #commentList {
    list-style: none;
    margin: 0 0 1.1rem;
    padding: 0;
  }

  #commentList li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }

  #commentList .c-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #commentList .c-date {
    flex: none;
    color: var(--ink-faint);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  #commentList .c-del {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0 0.2rem;
  }

  #commentList .c-del:hover { color: var(--accent); }

  #commentForm {
    display: flex;
    gap: 0.6rem;
  }

  #commentInput {
    flex: 1;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.55rem 0.7rem;
  }

  #commentForm button {
    background: var(--accent);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 0 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  #commentForm button:hover { background: var(--accent-soft); }

  .char-hint {
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin: 0.35rem 0 0;
  }

  footer {
    max-width: 920px;
    margin: 3rem auto 0;
    padding: 0 1.5rem;
    color: var(--ink-faint);
    font-size: 0.78rem;
    text-align: center;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand">
      <span class="ribbon" aria-hidden="true"></span>
      <div>
        <h1>책갈피</h1>
        <p class="tagline">읽은 책을 기록하고, 한 줄로 남겨두는 서재</p>
      </div>
    </div>
    <button class="btn-primary" id="newReviewBtn" type="button">+ 새 리뷰</button>
  </header>

  <main>
    <section id="libraryView">
      <p class="library-meta" id="countLabel"></p>
      <div class="shelf" id="shelfGrid"></div>
    </section>

    <section id="formView" hidden>
      <div class="panel">
        <h2>새 리뷰 쓰기</h2>
        <form id="reviewForm">
          <div class="field">
            <label for="fTitle">책 제목</label>
            <input type="text" id="fTitle" required maxlength="80" placeholder="예: 아몬드">
          </div>
          <div class="field">
            <label for="fAuthor">저자</label>
            <input type="text" id="fAuthor" required maxlength="60" placeholder="예: 손원평">
          </div>
          <div class="field">
            <label for="fCover">책 표지 사진</label>
            <div class="cover-picker">
              <div class="cover-preview" id="coverPreview">표지 없음</div>
              <div class="cover-picker-controls">
                <input type="file" id="fCover" accept="image/*">
                <button type="button" class="btn-ghost" id="clearCover" hidden>사진 지우기</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label>별점</label>
            <div class="star-picker" id="fStars" role="radiogroup" aria-label="별점"></div>
          </div>
          <div class="field">
            <label for="fText">한 줄 리뷰</label>
            <input type="text" id="fText" required maxlength="80" placeholder="이 책을 한 줄로 표현한다면?" autocomplete="off">
            <p class="char-hint">최대 80자, 한 줄로 남겨주세요</p>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-ghost" id="cancelForm">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </form>
      </div>
    </section>

    <section id="detailView" hidden>
      <button class="back-btn" id="backBtn" type="button">‹ 서재로</button>
      <div class="panel detail-card">
        <div class="detail-top">
          <div class="detail-cover" id="detailCover"></div>
          <header>
            <h2 id="detailTitle"></h2>
            <p class="detail-author" id="detailAuthor"></p>
            <div class="stars" id="detailStars"></div>
            <p class="meta-date" id="detailDate"></p>
          </header>
        </div>
        <p class="detail-review" id="detailText"></p>
        <button class="btn-ghost-danger" id="deleteBtn" type="button">이 리뷰 삭제</button>

        <section class="comments">
          <h3>한 줄 댓글 <span class="count" id="commentCount"></span></h3>
          <ul id="commentList"></ul>
          <form id="commentForm">
            <input type="text" id="commentInput" maxlength="60" required placeholder="한 줄로 남겨보세요" autocomplete="off">
            <button type="submit">남기기</button>
          </form>
          <p class="char-hint">최대 60자, 한 줄만 남길 수 있어요</p>
        </section>
      </div>
    </section>
  </main>
</div>

<footer>
  <p>모든 기록은 이 브라우저에만 저장돼요 (localStorage). 다른 기기·브라우저에는 보이지 않아요.</p>
</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "chaekgalpi_reviews_v1";

  var COVERS = ["#5B6B4F", "#3F5A6B", "#7C5A3A", "#6B4357", "#4A6B5C", "#7A4B3A"];

  function coverFor(title) {
    var hash = 0;
    for (var i = 0; i < title.length; i++) hash = (hash * 31 + title.charCodeAt(i)) >>> 0;
    return COVERS[hash % COVERS.length];
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }

  function seedData() {
    return [
      {
        id: uid(), title: "채식주의자", author: "한강", rating: 5, date: "2026.03.02", cover: null,
        text: "세 사람의 시선이 같은 사건을 전혀 다르게 비춘다",
        comments: [
          { id: uid(), text: "다 읽고 나서 며칠은 아무 책도 못 골랐다", date: "2026.03.03" },
          { id: uid(), text: "2부 시점이 가장 오래 남는다", date: "2026.03.05" }
        ]
      },
      {
        id: uid(), title: "달러구트 꿈 백화점", author: "이미예", rating: 4, date: "2026.02.14", cover: null,
        text: "잠들기 전 읽기 좋은 다정한 판타지",
        comments: [
          { id: uid(), text: "페니 캐릭터가 제일 좋았어요", date: "2026.02.16" }
        ]
      },
      {
        id: uid(), title: "불편한 편의점", author: "김호연", rating: 4, date: "2026.01.20", cover: null,
        text: "작은 공간에서 만나는 각자의 방식의 다정함",
        comments: []
      },
      {
        id: uid(), title: "아몬드", author: "손원평", rating: 5, date: "2025.12.09", cover: null,
        text: "감정을 모르는 아이가 되묻는, 감정이란 무엇인가",
        comments: [
          { id: uid(), text: "곤이 이야기에서 울 뻔했다", date: "2025.12.10" }
        ]
      }
    ];
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        var seeded = seedData();
        save(seeded);
        return seeded;
      }
      return JSON.parse(raw);
    } catch (e) {
      return seedData();
    }
  }

  function save(reviews) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
  }

  var reviews = load();
  var view = "library";
  var currentId = null;
  var formRating = 0;
  var formCover = null;

  var $shelf = document.getElementById("shelfGrid");
  var $countLabel = document.getElementById("countLabel");
  var $libraryView = document.getElementById("libraryView");
  var $formView = document.getElementById("formView");
  var $detailView = document.getElementById("detailView");
  var $fStars = document.getElementById("fStars");
  var $reviewForm = document.getElementById("reviewForm");
  var $coverPreview = document.getElementById("coverPreview");
  var $fCover = document.getElementById("fCover");
  var $clearCover = document.getElementById("clearCover");

  function updateCoverPreview() {
    $coverPreview.innerHTML = "";
    if (formCover) {
      var img = document.createElement("img");
      img.src = formCover;
      img.alt = "";
      $coverPreview.appendChild(img);
      $clearCover.hidden = false;
    } else {
      $coverPreview.textContent = "표지 없음";
      $clearCover.hidden = true;
    }
  }

  function readCoverFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxWidth = 480;
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        formCover = canvas.toDataURL("image/jpeg", 0.82);
        updateCoverPreview();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  $fCover.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) readCoverFile(file);
  });

  $clearCover.addEventListener("click", function () {
    formCover = null;
    $fCover.value = "";
    updateCoverPreview();
  });

  function renderStars(container, rating, interactive) {
    container.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var filled = i <= rating;
      if (interactive) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = filled ? "filled" : "";
        btn.textContent = filled ? "★" : "☆";
        btn.setAttribute("aria-label", i + "점");
        btn.addEventListener("click", function (idx) {
          return function () {
            formRating = idx;
            renderStars($fStars, formRating, true);
          };
        }(i));
        container.appendChild(btn);
      } else {
        var span = document.createElement("span");
        span.className = filled ? "" : "empty";
        span.textContent = filled ? "★" : "☆";
        container.appendChild(span);
      }
    }
  }

  function showView(name) {
    view = name;
    $libraryView.hidden = name !== "library";
    $formView.hidden = name !== "form";
    $detailView.hidden = name !== "detail";
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function renderLibrary() {
    $countLabel.textContent = reviews.length ? "총 " + reviews.length + "권의 리뷰" : "";
    $shelf.innerHTML = "";

    if (reviews.length === 0) {
      var note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = "아직 등록된 책이 없어요. 첫 리뷰를 남겨보세요.";
      $shelf.appendChild(note);
    }

    reviews.forEach(function (r) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "book-card";
      card.style.setProperty("--cover", coverFor(r.title));
      card.setAttribute("aria-label", r.title + ", " + r.author + ", 별점 " + r.rating + "점");

      if (r.cover) {
        var img = document.createElement("img");
        img.className = "b-cover-img";
        img.src = r.cover;
        img.alt = "";
        card.appendChild(img);
      }

      var stars = "";
      for (var i = 1; i <= 5; i++) stars += i <= r.rating ? "★" : "☆";

      var overlay = document.createElement("div");
      overlay.className = "b-overlay";

      var titleEl = document.createElement("div");
      titleEl.className = "b-title";
      titleEl.textContent = r.title;

      var authorEl = document.createElement("div");
      authorEl.className = "b-author";
      authorEl.textContent = r.author;

      var starsEl = document.createElement("div");
      starsEl.className = "b-stars";
      starsEl.textContent = stars;

      var countEl = document.createElement("div");
      countEl.className = "b-comment-count";
      countEl.textContent = "댓글 " + r.comments.length + "개";

      overlay.appendChild(titleEl);
      overlay.appendChild(authorEl);
      overlay.appendChild(starsEl);
      overlay.appendChild(countEl);
      card.appendChild(overlay);

      card.addEventListener("click", function (id) {
        return function () { openDetail(id); };
      }(r.id));

      $shelf.appendChild(card);
    });

    var addCard = document.createElement("button");
    addCard.type = "button";
    addCard.className = "add-card";
    addCard.textContent = "+ 새 리뷰 작성";
    addCard.addEventListener("click", openForm);
    $shelf.appendChild(addCard);
  }

  function openForm() {
    $reviewForm.reset();
    formRating = 0;
    formCover = null;
    renderStars($fStars, 0, true);
    updateCoverPreview();
    showView("form");
    document.getElementById("fTitle").focus();
  }

  function openDetail(id) {
    currentId = id;
    renderDetail();
    showView("detail");
  }

  function findReview(id) {
    for (var i = 0; i < reviews.length; i++) if (reviews[i].id === id) return reviews[i];
    return null;
  }

  function renderDetail() {
    var r = findReview(currentId);
    if (!r) { showView("library"); return; }

    document.getElementById("detailTitle").textContent = r.title;
    document.getElementById("detailAuthor").textContent = r.author;
    document.getElementById("detailDate").textContent = r.date + " 기록";
    document.getElementById("detailText").textContent = r.text;
    renderStars(document.getElementById("detailStars"), r.rating, false);

    var $detailCover = document.getElementById("detailCover");
    $detailCover.innerHTML = "";
    $detailCover.style.setProperty("--cover", coverFor(r.title));
    if (r.cover) {
      var coverImg = document.createElement("img");
      coverImg.src = r.cover;
      coverImg.alt = "";
      $detailCover.appendChild(coverImg);
    }

    var $list = document.getElementById("commentList");
    $list.innerHTML = "";
    document.getElementById("commentCount").textContent = r.comments.length ? "(" + r.comments.length + ")" : "";

    if (r.comments.length === 0) {
      var li = document.createElement("li");
      li.style.color = "var(--ink-faint)";
      li.style.fontSize = "0.88rem";
      li.textContent = "아직 댓글이 없어요. 첫 한 줄을 남겨보세요.";
      $list.appendChild(li);
    } else {
      r.comments.forEach(function (c) {
        var item = document.createElement("li");
        var textSpan = document.createElement("span");
        textSpan.className = "c-text";
        textSpan.textContent = c.text;
        textSpan.title = c.text;

        var dateSpan = document.createElement("span");
        dateSpan.className = "c-date";
        dateSpan.textContent = c.date;

        var delBtn = document.createElement("button");
        delBtn.className = "c-del";
        delBtn.type = "button";
        delBtn.textContent = "×";
        delBtn.setAttribute("aria-label", "댓글 삭제");
        delBtn.addEventListener("click", function () {
          r.comments = r.comments.filter(function (x) { return x.id !== c.id; });
          save(reviews);
          renderDetail();
        });

        item.appendChild(textSpan);
        item.appendChild(dateSpan);
        item.appendChild(delBtn);
        $list.appendChild(item);
      });
    }
  }

  document.getElementById("newReviewBtn").addEventListener("click", openForm);
  document.getElementById("cancelForm").addEventListener("click", function () { showView("library"); });
  document.getElementById("backBtn").addEventListener("click", function () {
    renderLibrary();
    showView("library");
  });

  $reviewForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = document.getElementById("fTitle").value.trim();
    var author = document.getElementById("fAuthor").value.trim();
    var text = document.getElementById("fText").value.trim();

    if (!title || !author || !text || formRating === 0) {
      if (formRating === 0) alert("별점을 선택해주세요.");
      return;
    }

    reviews.unshift({
      id: uid(), title: title, author: author, rating: formRating, cover: formCover,
      date: todayStr(), text: text, comments: []
    });
    save(reviews);
    renderLibrary();
    showView("library");
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    if (!confirm("이 리뷰를 삭제할까요? 댓글도 함께 사라져요.")) return;
    reviews = reviews.filter(function (r) { return r.id !== currentId; });
    save(reviews);
    renderLibrary();
    showView("library");
  });

  document.getElementById("commentForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("commentInput");
    var text = input.value.replace(/[\r\n]+/g, " ").trim();
    if (!text) return;

    var r = findReview(currentId);
    r.comments.push({ id: uid(), text: text.slice(0, 60), date: todayStr() });
    save(reviews);
    input.value = "";
    renderDetail();
  });

  renderLibrary();
  showView("library");
})();
</script>
</body>
</html>
