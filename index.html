<!DOCTYPE html>
<html lang="ko">
<head></head>
<meta charset="UTF-8">
<title>책갈피</title>
<meta name="description" content="읽은 책마다 별점과 한 줄 감상을 남겨두는 개인 서재">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --paper: #EFEAE1;
    --paper-soft: #E2D9C9;
    --paper-raised: #F7F3EC;
    --ink: #241F1C;
    --ink-soft: #6B6058;
    --ink-faint: #94897C;
    --accent: #8C2F39;
    --accent-soft: #B5555F;
    --line: rgba(36, 31, 28, 0.14);
    --shadow: rgba(36, 31, 28, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1815;
      --paper-soft: #262019;
      --paper-raised: #221D19;
      --ink: #EDE6DA;
      --ink-soft: #A79C8E;
      --ink-faint: #766B5F;
      --accent: #E08A90;
      --accent-soft: #C1636B;
      --line: rgba(237, 230, 218, 0.16);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1B1815;
    --paper-soft: #262019;
    --paper-raised: #221D19;
    --ink: #EDE6DA;
    --ink-soft: #A79C8E;
    --ink-faint: #766B5F;
    --accent: #E08A90;
    --accent-soft: #C1636B;
    --line: rgba(237, 230, 218, 0.16);
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* header */

  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2.25rem;
  }

  .brand {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
  }

  .ribbon {
    width: 10px;
    height: 52px;
    flex: none;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    margin-top: 2px;
  }

  .brand h1 {
    margin: 0;
    font-family: "Gowun Batang", "Malgun Gothic", serif;
    font-weight: 700;
    font-size: clamp(1.9rem, 4vw, 2.4rem);
    letter-spacing: 0.02em;
  }

  .tagline {
    margin: 0.3rem 0 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  .btn-primary {
    flex: none;
    background: var(--accent);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 0.65rem 1.1rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .btn-primary:hover { background: var(--accent-soft); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* auth */

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: none;
  }

  .auth-box { display: flex; align-items: center; }

  .btn-google {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--paper-raised);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.6rem 1rem;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .btn-google:hover { border-color: var(--ink-soft); }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    flex: none;
    background: var(--paper-soft);
  }

  .user-name {
    font-size: 0.88rem;
    color: var(--ink-soft);
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-logout {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .btn-logout:hover { color: var(--accent); }

  .signin-prompt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.6rem;
    background: var(--paper-soft);
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 0.8rem 1rem;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  /* library grid */

  .library-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.1rem;
  }

  .library-meta {
    color: var(--ink-faint);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .search-box input[type="search"] {
    width: 220px;
    max-width: 100%;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
  }

  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.1rem;
  }

  .book-card {
    position: relative;
    display: block;
    aspect-ratio: 2 / 3;
    text-align: left;
    background: var(--cover, var(--accent));
    color: #F3EEE4;
    border: none;
    border-radius: 4px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 10px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .book-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px var(--shadow);
  }

  .b-cover-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  .b-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 0.85rem 0.8rem 0.75rem;
    background: linear-gradient(to top, rgba(10, 8, 6, 0.85) 0%, rgba(10, 8, 6, 0.55) 48%, rgba(10, 8, 6, 0) 100%);
  }

  .book-card .b-title {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.35;
    text-wrap: balance;
    margin: 0 0 0.3rem;
  }

  .book-card .b-author {
    font-size: 0.8rem;
    opacity: 0.9;
    margin: 0 0 0.5rem;
  }

  .book-card .b-stars {
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .empty-note {
    color: var(--ink-faint);
    font-size: 0.9rem;
    padding: 1.5rem 0;
  }

  /* form */

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.75rem;
  }

  .panel h2 {
    font-family: "Gowun Batang", serif;
    margin: 0 0 1.4rem;
    font-size: 1.4rem;
  }

  .field {
    margin-bottom: 1.15rem;
  }

  .field label {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-bottom: 0.4rem;
  }

  .field input[type="text"],
  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.6rem 0.7rem;
    resize: vertical;
  }

  .field textarea { min-height: 110px; line-height: 1.6; }

  .cover-picker {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .cover-preview {
    width: 72px;
    aspect-ratio: 2 / 3;
    flex: none;
    border-radius: 4px;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    font-size: 0.68rem;
    text-align: center;
    line-height: 1.4;
    padding: 0.3rem;
  }

  .cover-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-picker-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }

  .cover-picker-controls input[type="file"] {
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 230px;
  }

  .star-picker {
    display: flex;
    gap: 0.25rem;
  }

  .star-picker button {
    background: none;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0.1rem;
  }

  .star-picker button.filled { color: var(--accent); }
  .star-picker button:hover { color: var(--accent-soft); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: 1.5rem;
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 0.6rem 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* detail */

  .back-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.3rem 0;
    margin-bottom: 1.25rem;
  }

  .back-btn:hover { color: var(--accent); }

  .detail-top {
    display: flex;
    gap: 1.25rem;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 1.1rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--line);
  }

  .detail-cover {
    width: 96px;
    aspect-ratio: 2 / 3;
    flex: none;
    border-radius: 4px;
    overflow: hidden;
    background: var(--cover, var(--accent));
    box-shadow: 0 3px 10px var(--shadow);
  }

  .detail-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .detail-card header {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1;
    min-width: 200px;
  }

  .detail-card h2 {
    font-family: "Gowun Batang", serif;
    font-size: 1.7rem;
    margin: 0;
    text-wrap: balance;
  }

  .detail-author { color: var(--ink-soft); margin: 0; font-size: 0.95rem; }

  .stars { color: var(--accent); letter-spacing: 0.08em; font-size: 1.05rem; }
  .stars .empty { color: var(--ink-faint); }

  .rating-line {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .rating-meta {
    color: var(--ink-faint);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .meta-date {
    color: var(--ink-faint);
    font-size: 0.8rem;
    margin: 0.2rem 0 0;
    font-variant-numeric: tabular-nums;
  }

  .meta-owner {
    color: var(--ink-faint);
    font-size: 0.8rem;
    margin: 0.15rem 0 0;
  }

  .detail-review {
    max-width: 62ch;
    font-family: "Gowun Batang", serif;
    font-size: 1.18rem;
    line-height: 1.5;
    margin: 0 0 0.25rem;
  }

  .detail-review::before,
  .detail-review::after {
    color: var(--accent);
  }

  .detail-review::before { content: "\201C"; }
  .detail-review::after { content: "\201D"; }

  .btn-ghost-danger {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 3px;
    padding: 0.5rem 0.9rem;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 0.5rem;
  }

  .btn-ghost-danger:hover { border-color: var(--accent); color: var(--accent); }

  .comments {
    margin-top: 2.25rem;
  }

  .comments h3 {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 0.9rem;
  }

  .comments h3 .count {
    color: var(--ink-faint);
    font-weight: 400;
    font-size: 0.85rem;
  }

  #commentList {
    list-style: none;
    margin: 0 0 1.1rem;
    padding: 0;
  }

  #commentList li {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.4rem 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }

  #commentList .c-text {
    flex: 1 1 100%;
    min-width: 0;
    word-break: break-word;
  }

  #commentList .c-rating {
    flex: none;
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
  }

  #commentList .c-author {
    flex: none;
    color: var(--ink-faint);
    font-size: 0.78rem;
  }

  #commentList .c-like {
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--ink-faint);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  #commentList .c-like:hover { border-color: var(--accent); color: var(--accent); }

  #commentList .c-like.liked {
    color: var(--accent);
    border-color: var(--accent);
  }

  #commentList .c-date {
    flex: none;
    color: var(--ink-faint);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  #commentList .c-del {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0 0.2rem;
  }

  #commentList .c-del:hover { color: var(--accent); }

  #commentForm {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  #commentForm .field {
    margin-bottom: 0;
  }

  #commentForm .field label {
    font-size: 0.78rem;
    margin-bottom: 0.15rem;
  }

  .comment-input-row {
    display: flex;
    gap: 0.6rem;
  }

  #commentInput {
    flex: 1;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.55rem 0.7rem;
  }

  .comment-input-row button {
    background: var(--accent);
    color: var(--paper-raised);
    border: none;
    border-radius: 3px;
    padding: 0 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  .comment-input-row button:hover { background: var(--accent-soft); }

  .char-hint {
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin: 0.35rem 0 0;
  }

  footer {
    max-width: 920px;
    margin: 3rem auto 0;
    padding: 0 1.5rem;
    color: var(--ink-faint);
    font-size: 0.78rem;
    text-align: center;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand">
      <span class="ribbon" aria-hidden="true"></span>
      <div>
        <h1>책갈피</h1>
        <p class="tagline">읽은 책마다 별점과 한 줄 감상을 남겨보세요</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="auth-box" id="authBox"></div>
      <button class="btn-primary" id="newReviewBtn" type="button">+ 책 기록하기</button>
    </div>
  </header>

  <main>
    <section id="libraryView">
      <div class="library-toolbar">
        <p class="library-meta" id="countLabel"></p>
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="책 제목으로 검색" aria-label="책 제목으로 검색">
        </div>
      </div>
      <div class="shelf" id="shelfGrid"></div>
    </section>

    <section id="formView" hidden>
      <div class="panel">
        <h2>새 책 기록하기</h2>
        <form id="reviewForm">
          <div class="field">
            <label for="fTitle">책 제목</label>
            <input type="text" id="fTitle" required maxlength="80" placeholder="예: 아몬드">
          </div>
          <div class="field">
            <label for="fAuthor">저자</label>
            <input type="text" id="fAuthor" required maxlength="60" placeholder="예: 손원평">
          </div>
          <div class="field">
            <label for="fCover">책 표지 사진 (선택)</label>
            <div class="cover-picker">
              <div class="cover-preview" id="coverPreview">표지 없음</div>
              <div class="cover-picker-controls">
                <input type="file" id="fCover" accept="image/*">
                <button type="button" class="btn-ghost" id="clearCover" hidden>사진 지우기</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label>별점 (필수)</label>
            <div class="star-picker" id="fStars" role="radiogroup" aria-label="리뷰 별점"></div>
          </div>
          <div class="field">
            <label for="fText">한 줄 리뷰</label>
            <input type="text" id="fText" required maxlength="80" placeholder="이 책을 한 줄로 표현한다면?" autocomplete="off">
            <p class="char-hint">최대 80자, 한 줄로 남겨주세요</p>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-ghost" id="cancelForm">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </form>
      </div>
    </section>

    <section id="detailView" hidden>
      <button class="back-btn" id="backBtn" type="button">‹ 서재로</button>
      <div class="panel detail-card">
        <div class="detail-top">
          <div class="detail-cover" id="detailCover"></div>
          <header>
            <h2 id="detailTitle"></h2>
            <p class="detail-author" id="detailAuthor"></p>
            <div class="rating-line">
              <div class="stars" id="detailStars"></div>
              <span class="rating-meta" id="detailRatingMeta"></span>
            </div>
            <p class="meta-date" id="detailDate"></p>
            <p class="meta-owner" id="detailOwner"></p>
          </header>
        </div>
        <p class="detail-review" id="detailText"></p>
        <button class="btn-ghost-danger" id="deleteBtn" type="button" hidden>이 책 리뷰 삭제하기</button>

        <section class="comments">
          <h3>한줄평 · 별점 <span class="count" id="commentCount"></span> <span class="count">· 좋아요 많은 순</span></h3>
          <ul id="commentList"></ul>
          <form id="commentForm" hidden>
            <div class="field">
              <label>별점 (필수)</label>
              <div class="star-picker" id="cStars" role="radiogroup" aria-label="댓글 별점"></div>
            </div>
            <div class="comment-input-row">
              <input type="text" id="commentInput" maxlength="60" required placeholder="이 책에 대한 한 줄 감상을 남겨보세요" autocomplete="off">
              <button type="submit">남기기</button>
            </div>
          </form>
          <p class="char-hint" id="commentHint">별점을 선택하고 한 줄 감상을 남겨주세요 (최대 60자)</p>
          <div class="signin-prompt" id="commentSignin" hidden>
            <span>로그인하면 이 책에 한줄평을 남길 수 있어요.</span>
            <button type="button" class="btn-google" id="commentLoginBtn">Google로 로그인</button>
          </div>
        </section>
      </div>
    </section>
  </main>
</div>

<footer>
  <p>Google 계정으로 로그인해서 남긴 기록은 모두에게 실시간으로 공유돼요.</p>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
  import {
    getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, getDocs,
    onSnapshot, query, orderBy, serverTimestamp, increment, arrayUnion, arrayRemove, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

  // 아래 값을 본인의 Firebase 프로젝트 설정(Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱)으로 교체하세요.
  var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  if (firebaseConfig.apiKey === "YOUR_API_KEY") {
    document.getElementById("shelfGrid").innerHTML =
      '<p class="empty-note">Firebase 설정이 아직 연결되지 않았어요. index.html의 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 교체해주세요.</p>';
    document.getElementById("newReviewBtn").disabled = true;
  } else {
    runApp();
  }

  function runApp() {

  var app = initializeApp(firebaseConfig);
  var auth = getAuth(app);
  var db = getFirestore(app);
  var provider = new GoogleAuthProvider();

  var COVERS = ["#5B6B4F", "#3F5A6B", "#7C5A3A", "#6B4357", "#4A6B5C", "#7A4B3A"];

  function coverFor(title) {
    var hash = 0;
    for (var i = 0; i < title.length; i++) hash = (hash * 31 + title.charCodeAt(i)) >>> 0;
    return COVERS[hash % COVERS.length];
  }

  function formatDate(ts) {
    if (!ts || !ts.toDate) return "방금 등록";
    var d = ts.toDate();
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }

  function bookRating(b) {
    if (!b.ratingCount) return null;
    return { avg: b.ratingSum / b.ratingCount, count: b.ratingCount };
  }

  function signIn() {
    return signInWithPopup(auth, provider).catch(function (e) {
      alert("로그인에 실패했어요: " + e.message);
    });
  }

  var currentUser = null;
  var books = [];
  var booksLoaded = false;
  var comments = [];
  var unsubscribeComments = null;
  var view = "library";
  var currentId = null;
  var commentRating = 0;
  var formRating = 0;
  var formCover = null;
  var searchQuery = "";

  var $shelf = document.getElementById("shelfGrid");
  var $countLabel = document.getElementById("countLabel");
  var $searchInput = document.getElementById("searchInput");
  var $libraryView = document.getElementById("libraryView");
  var $formView = document.getElementById("formView");
  var $detailView = document.getElementById("detailView");
  var $cStars = document.getElementById("cStars");
  var $fStars = document.getElementById("fStars");
  var $reviewForm = document.getElementById("reviewForm");
  var $coverPreview = document.getElementById("coverPreview");
  var $fCover = document.getElementById("fCover");
  var $clearCover = document.getElementById("clearCover");

  function updateCoverPreview() {
    $coverPreview.innerHTML = "";
    if (formCover) {
      var img = document.createElement("img");
      img.src = formCover;
      img.alt = "";
      $coverPreview.appendChild(img);
      $clearCover.hidden = false;
    } else {
      $coverPreview.textContent = "표지 없음";
      $clearCover.hidden = true;
    }
  }

  function readCoverFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxWidth = 480;
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        formCover = canvas.toDataURL("image/jpeg", 0.82);
        updateCoverPreview();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  $fCover.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) readCoverFile(file);
  });

  $clearCover.addEventListener("click", function () {
    formCover = null;
    $fCover.value = "";
    updateCoverPreview();
  });

  function renderStars(container, rating, interactive, onSelect) {
    container.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var filled = i <= rating;
      if (interactive) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = filled ? "filled" : "";
        btn.textContent = filled ? "★" : "☆";
        btn.setAttribute("aria-label", i + "점");
        btn.addEventListener("click", function (idx) {
          return function () { onSelect(idx); };
        }(i));
        container.appendChild(btn);
      } else {
        var span = document.createElement("span");
        span.className = filled ? "" : "empty";
        span.textContent = filled ? "★" : "☆";
        container.appendChild(span);
      }
    }
  }

  function selectCommentRating(idx) {
    commentRating = idx;
    renderStars($cStars, commentRating, true, selectCommentRating);
  }

  function selectFormRating(idx) {
    formRating = idx;
    renderStars($fStars, formRating, true, selectFormRating);
  }

  function showView(name) {
    view = name;
    $libraryView.hidden = name !== "library";
    $formView.hidden = name !== "form";
    $detailView.hidden = name !== "detail";
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function findBook(id) {
    for (var i = 0; i < books.length; i++) if (books[i].id === id) return books[i];
    return null;
  }

  function leaveDetail() {
    if (unsubscribeComments) { unsubscribeComments(); unsubscribeComments = null; }
    comments = [];
  }

  function renderAuthBox() {
    var $box = document.getElementById("authBox");
    $box.innerHTML = "";
    if (currentUser) {
      var chip = document.createElement("div");
      chip.className = "user-chip";
      if (currentUser.photoURL) {
        var avatar = document.createElement("img");
        avatar.className = "user-avatar";
        avatar.src = currentUser.photoURL;
        avatar.alt = "";
        chip.appendChild(avatar);
      }
      var name = document.createElement("span");
      name.className = "user-name";
      name.textContent = currentUser.displayName || "사용자";
      chip.appendChild(name);
      var logout = document.createElement("button");
      logout.type = "button";
      logout.className = "btn-logout";
      logout.textContent = "로그아웃";
      logout.addEventListener("click", function () { signOut(auth); });
      chip.appendChild(logout);
      $box.appendChild(chip);
    } else {
      var loginBtn = document.createElement("button");
      loginBtn.type = "button";
      loginBtn.className = "btn-google";
      loginBtn.textContent = "Google로 로그인";
      loginBtn.addEventListener("click", function () { signIn(); });
      $box.appendChild(loginBtn);
    }
  }

  function renderLibrary() {
    var query = searchQuery.trim().toLowerCase();
    var visible = query
      ? books.filter(function (r) { return r.title.toLowerCase().indexOf(query) !== -1; })
      : books;

    if (!booksLoaded) {
      $countLabel.textContent = "불러오는 중...";
    } else if (query) {
      $countLabel.textContent = visible.length + "권 검색됨 (전체 " + books.length + "권)";
    } else {
      $countLabel.textContent = books.length ? "총 " + books.length + "권의 리뷰" : "";
    }

    $shelf.innerHTML = "";

    if (booksLoaded && books.length === 0) {
      var note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = "아직 기록한 책이 없어요. 위쪽 '+ 책 기록하기' 버튼으로 첫 책을 남겨보세요.";
      $shelf.appendChild(note);
    } else if (query && visible.length === 0) {
      var noMatch = document.createElement("p");
      noMatch.className = "empty-note";
      noMatch.textContent = "\"" + searchQuery.trim() + "\"에 해당하는 책이 없어요.";
      $shelf.appendChild(noMatch);
    }

    visible.forEach(function (r) {
      var rating = bookRating(r);
      var card = document.createElement("button");
      card.type = "button";
      card.className = "book-card";
      card.style.setProperty("--cover", coverFor(r.title));
      card.setAttribute("aria-label", r.title + ", " + r.author + ", " +
        (rating ? "평점 " + rating.avg.toFixed(1) + "점, 참여자 " + rating.count + "명" : "아직 평점 없음"));

      if (r.cover) {
        var img = document.createElement("img");
        img.className = "b-cover-img";
        img.src = r.cover;
        img.alt = "";
        card.appendChild(img);
      }

      var overlay = document.createElement("div");
      overlay.className = "b-overlay";

      var titleEl = document.createElement("div");
      titleEl.className = "b-title";
      titleEl.textContent = r.title;

      var authorEl = document.createElement("div");
      authorEl.className = "b-author";
      authorEl.textContent = r.author;

      var starsEl = document.createElement("div");
      starsEl.className = "b-stars";
      if (rating) {
        var stars = "";
        for (var i = 1; i <= 5; i++) stars += i <= Math.round(rating.avg) ? "★" : "☆";
        starsEl.textContent = stars + " " + rating.avg.toFixed(1) + " (" + rating.count + ")";
      } else {
        starsEl.textContent = "평점 없음";
      }

      overlay.appendChild(titleEl);
      overlay.appendChild(authorEl);
      overlay.appendChild(starsEl);
      card.appendChild(overlay);

      card.addEventListener("click", function (id) {
        return function () { openDetail(id); };
      }(r.id));

      $shelf.appendChild(card);
    });
  }

  function openForm() {
    $reviewForm.reset();
    formCover = null;
    formRating = 0;
    updateCoverPreview();
    renderStars($fStars, 0, true, selectFormRating);
    showView("form");
    document.getElementById("fTitle").focus();
  }

  function openDetail(id) {
    currentId = id;
    commentRating = 0;
    renderStars($cStars, 0, true, selectCommentRating);
    leaveDetail();
    var commentsQuery = query(collection(db, "books", id, "comments"), orderBy("createdAt", "asc"));
    unsubscribeComments = onSnapshot(commentsQuery, function (snap) {
      comments = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (view === "detail" && currentId === id) renderDetail();
    });
    renderDetail();
    showView("detail");
  }

  function renderDetail() {
    var r = findBook(currentId);
    if (!r) { showView("library"); return; }

    document.getElementById("detailTitle").textContent = r.title;
    document.getElementById("detailAuthor").textContent = r.author;
    document.getElementById("detailDate").textContent = formatDate(r.createdAt) + " 기록";
    document.getElementById("detailOwner").textContent = "등록: " + (r.ownerName || "알 수 없음");
    document.getElementById("detailText").textContent = r.text;

    var rating = bookRating(r);
    renderStars(document.getElementById("detailStars"), rating ? Math.round(rating.avg) : 0, false);
    document.getElementById("detailRatingMeta").textContent = rating
      ? rating.avg.toFixed(1) + " (" + rating.count + ")"
      : "아직 평점 없음";

    var $detailCover = document.getElementById("detailCover");
    $detailCover.innerHTML = "";
    $detailCover.style.setProperty("--cover", coverFor(r.title));
    if (r.cover) {
      var coverImg = document.createElement("img");
      coverImg.src = r.cover;
      coverImg.alt = "";
      $detailCover.appendChild(coverImg);
    }

    document.getElementById("deleteBtn").hidden = !(currentUser && currentUser.uid === r.ownerUid);

    var $commentForm = document.getElementById("commentForm");
    var $commentSignin = document.getElementById("commentSignin");
    var $commentHint = document.getElementById("commentHint");
    $commentForm.hidden = !currentUser;
    $commentSignin.hidden = !!currentUser;
    $commentHint.hidden = !currentUser;

    var $list = document.getElementById("commentList");
    $list.innerHTML = "";
    document.getElementById("commentCount").textContent = comments.length ? "(" + comments.length + ")" : "";

    if (comments.length === 0) {
      var li = document.createElement("li");
      li.style.color = "var(--ink-faint)";
      li.style.fontSize = "0.88rem";
      li.textContent = "아직 댓글이 없어요. 별점과 함께 첫 한 줄을 남겨보세요.";
      $list.appendChild(li);
    } else {
      var sortedComments = comments.slice().sort(function (a, b) {
        return (b.likedBy ? b.likedBy.length : 0) - (a.likedBy ? a.likedBy.length : 0);
      });

      sortedComments.forEach(function (c) {
        var likedBy = c.likedBy || [];
        var likedByMe = !!(currentUser && likedBy.indexOf(currentUser.uid) !== -1);

        var item = document.createElement("li");
        var textSpan = document.createElement("span");
        textSpan.className = "c-text";
        textSpan.textContent = c.text;
        textSpan.title = c.text;

        var authorSpan = document.createElement("span");
        authorSpan.className = "c-author";
        authorSpan.textContent = c.authorName || "익명";

        var ratingSpan = document.createElement("span");
        ratingSpan.className = "c-rating";
        if (typeof c.rating === "number") {
          var ratingStars = "";
          for (var i = 1; i <= 5; i++) ratingStars += i <= c.rating ? "★" : "☆";
          ratingSpan.textContent = ratingStars;
        }

        var likeBtn = document.createElement("button");
        likeBtn.type = "button";
        likeBtn.className = "c-like" + (likedByMe ? " liked" : "");
        likeBtn.textContent = "♥ " + likedBy.length;
        likeBtn.setAttribute("aria-pressed", likedByMe ? "true" : "false");
        likeBtn.setAttribute("aria-label", "좋아요 " + likedBy.length + "개");
        likeBtn.addEventListener("click", function () {
          if (!currentUser) { signIn(); return; }
          var cRef = doc(db, "books", currentId, "comments", c.id);
          updateDoc(cRef, { likedBy: likedByMe ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
        });

        var dateSpan = document.createElement("span");
        dateSpan.className = "c-date";
        dateSpan.textContent = formatDate(c.createdAt);

        item.appendChild(textSpan);
        item.appendChild(authorSpan);
        item.appendChild(ratingSpan);
        item.appendChild(likeBtn);
        item.appendChild(dateSpan);

        if (currentUser && currentUser.uid === c.authorUid) {
          var delBtn = document.createElement("button");
          delBtn.className = "c-del";
          delBtn.type = "button";
          delBtn.textContent = "×";
          delBtn.setAttribute("aria-label", "댓글 삭제");
          delBtn.addEventListener("click", function () {
            var bookId = currentId;
            deleteDoc(doc(db, "books", bookId, "comments", c.id));
            updateDoc(doc(db, "books", bookId), {
              ratingSum: increment(-c.rating),
              ratingCount: increment(-1),
              commentCount: increment(-1)
            });
          });
          item.appendChild(delBtn);
        }

        $list.appendChild(item);
      });
    }
  }

  $searchInput.addEventListener("input", function (e) {
    searchQuery = e.target.value;
    renderLibrary();
  });

  document.getElementById("newReviewBtn").addEventListener("click", function () {
    if (auth.currentUser) { openForm(); return; }
    signIn().then(function () { if (auth.currentUser) openForm(); });
  });
  document.getElementById("cancelForm").addEventListener("click", function () { showView("library"); });
  document.getElementById("backBtn").addEventListener("click", function () {
    leaveDetail();
    renderLibrary();
    showView("library");
  });
  document.getElementById("commentLoginBtn").addEventListener("click", function () { signIn(); });

  $reviewForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!currentUser) { alert("로그인 후 등록할 수 있어요."); return; }

    var title = document.getElementById("fTitle").value.trim();
    var author = document.getElementById("fAuthor").value.trim();
    var text = document.getElementById("fText").value.trim();

    if (!title || !author || !text) return;

    var isDuplicate = books.some(function (r) {
      return r.title.trim().toLowerCase() === title.toLowerCase();
    });
    if (isDuplicate) {
      alert("이미 등록된 책 제목이에요. 서재에서 기존 리뷰를 확인해보세요.");
      document.getElementById("fTitle").focus();
      return;
    }

    if (formRating === 0) {
      alert("별점을 선택해주세요.");
      return;
    }

    addDoc(collection(db, "books"), {
      title: title, author: author, cover: formCover, text: text,
      ratingSum: formRating, ratingCount: 1, commentCount: 0,
      ownerUid: currentUser.uid, ownerName: currentUser.displayName || "사용자", ownerPhoto: currentUser.photoURL || null,
      createdAt: serverTimestamp()
    }).then(function () {
      showView("library");
    }).catch(function (e) {
      alert("저장에 실패했어요: " + e.message);
    });
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    var r = findBook(currentId);
    if (!r || !currentUser || currentUser.uid !== r.ownerUid) return;
    if (!confirm("이 리뷰를 삭제할까요? 댓글도 함께 사라져요.")) return;

    var bookId = currentId;
    getDocs(collection(db, "books", bookId, "comments")).then(function (snap) {
      var batch = writeBatch(db);
      snap.forEach(function (d) { batch.delete(d.ref); });
      batch.delete(doc(db, "books", bookId));
      return batch.commit();
    }).then(function () {
      leaveDetail();
      renderLibrary();
      showView("library");
    }).catch(function (e) {
      alert("삭제에 실패했어요: " + e.message);
    });
  });

  document.getElementById("commentForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!currentUser) { signIn(); return; }

    var input = document.getElementById("commentInput");
    var text = input.value.replace(/[\r\n]+/g, " ").trim();
    if (!text) return;
    if (commentRating === 0) {
      alert("별점을 선택해주세요.");
      return;
    }

    var bookId = currentId;
    var rating = commentRating;
    addDoc(collection(db, "books", bookId, "comments"), {
      text: text.slice(0, 60), rating: rating,
      authorUid: currentUser.uid, authorName: currentUser.displayName || "사용자", authorPhoto: currentUser.photoURL || null,
      likedBy: [], createdAt: serverTimestamp()
    }).then(function () {
      return updateDoc(doc(db, "books", bookId), {
        ratingSum: increment(rating),
        ratingCount: increment(1),
        commentCount: increment(1)
      });
    }).then(function () {
      input.value = "";
      commentRating = 0;
      renderStars($cStars, 0, true, selectCommentRating);
    }).catch(function (e) {
      alert("등록에 실패했어요: " + e.message);
    });
  });

  onAuthStateChanged(auth, function (user) {
    currentUser = user;
    renderAuthBox();
    if (view === "detail") renderDetail();
    else if (view === "library") renderLibrary();
  });

  onSnapshot(query(collection(db, "books"), orderBy("createdAt", "desc")), function (snap) {
    books = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    booksLoaded = true;
    if (view === "library") renderLibrary();
    else if (view === "detail") renderDetail();
  });

  renderAuthBox();
  renderLibrary();
  showView("library");

  } // end runApp
</script>
</body>
</html>
